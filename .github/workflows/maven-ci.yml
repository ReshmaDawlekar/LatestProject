name: Java CI with Maven

on:
  push:
    branches: [ "reshma-latest", "reshma-latest" ]
  pull_request:
    branches: [ "reshma-latest", "reshma-latest" ]
  workflow_dispatch:  # Allows manual trigger from GitHub Actions UI

# Opt into Node.js 24 for all actions (fixes Node.js 20 deprecation warning)
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-and-test:
    name: Build & Run Maven Tests
    runs-on: ubuntu-latest

    steps:
      # Step 1: Checkout the repository code
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Step 2: Set up Java 17 with Maven dependency caching
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven


      # Step 7: Run Maven tests
      # Edge runs in headless mode via DISPLAY=:99 set above.
      # -e = show full stack traces, -fae = run all tests before failing
      - name: Run Tests with Maven
        run: mvn clean test -DsuiteXmlFile=testng.xml
        env:
          DISPLAY: :99

      # Step 8: Upload Surefire test reports (always runs, even on failure)
      - name: Upload Test Reports
        uses: actions/upload-artifact@v6
        if: always()
        with:
          name: surefire-test-reports
          path: target/surefire-reports/
          retention-days: 7